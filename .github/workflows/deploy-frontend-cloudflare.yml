name: Deploy Frontend CF Pages[Pages前端分離部署]

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "!frontend/vercel.json"
  workflow_dispatch:
    inputs:
      from_panel:
        description: "是否由部署控制面板觸發 / triggered from deployment control panel"
        required: false
        default: "false"
  repository_dispatch:
    types: [deploy-button]

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: 🔍 檢查部署配置
        id: check
        run: |
          # 手動觸發時（workflow_dispatch / repository_dispatch），總是部署，忽略自動部署開關
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 手動觸發（repository_dispatch），忽略開關，允許部署"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.from_panel }}" != "true" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 手動觸發（workflow_dispatch），忽略開關，允許部署"
            exit 0
          fi

          # 自動觸發（push 或控制面板觸發）根據倉庫級變數決定是否部署
          FRONTEND_ENABLED="${{ vars.FRONTEND_DEPLOY }}"
          # 預設行為：如果倉庫變數未設定，視為已開啟自動部署（向下相容舊邏輯）
          [ -z "$FRONTEND_ENABLED" ] && FRONTEND_ENABLED="true"

          if [ "$FRONTEND_ENABLED" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 前端自動部署已開啟，允許部署"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⏸️ 前端自動部署已關閉，跳過部署"
          fi

  deploy-frontend-cloudflare:
    needs: check-config
    if: needs.check-config.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Check if deploy button trigger
        id: check-deploy-button
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" && "${{ github.event.action }}" == "deploy-button" ]]; then
            echo "is_deploy_button=true" >> $GITHUB_OUTPUT
          else
            echo "is_deploy_button=false" >> $GITHUB_OUTPUT
          fi

      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_ENABLE_DEVTOOLS: false

      - name: Copy Cloudflare Functions
        run: |
          mkdir -p dist/functions
          cp -r functions/* dist/functions/ || echo "No functions directory found"

      - name: Check if Pages project exists
        id: check-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "檢查 Cloudflare Pages 專案是否存在..."
          PROJECT_CHECK=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[] | select(.name=="cloudharbor-frontend") | .name')

          if [ -n "$PROJECT_CHECK" ]; then
            echo "✅ 找到現有Pages專案: cloudharbor-frontend"
            echo "project_exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ 未找到Pages專案: cloudharbor-frontend"
            echo "project_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pages project if not exists
        if: steps.check-project.outputs.project_exists == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "建立 Cloudflare Pages 專案: cloudharbor-frontend..."
          cat << EOF > pages-config.json
          {
            "name": "cloudharbor-frontend",
            "production_branch": "production"
          }
          EOF

          CREATE_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data @pages-config.json)

          SUCCESS=$(echo "$CREATE_RESULT" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ 建立Pages專案失敗，請手動建立專案後再次執行"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COMMIT_MSG=$(cat << 'EOF'
          ${{ github.event.head_commit.message }}
          EOF
          )
          # 清理非UTF-8字元並限制長度
          CLEAN_MSG=$(echo "$COMMIT_MSG" | iconv -f utf-8 -t utf-8 -c | head -c 200)
          # 如果訊息為空或無效，使用預設訊息
          if [ -z "$CLEAN_MSG" ]; then
            CLEAN_MSG="Deploy from GitHub Actions"
          fi
          npx wrangler pages deploy ./dist --project-name=cloudharbor-frontend --branch production --commit-message="$CLEAN_MSG" 2>&1 | sed -E 's/https:\/\/[a-zA-Z0-9.-]*\.(workers|pages)\.dev/https:\/\/[REDACTED].\1.dev/g'

      - name: Display Success Information
        if: steps.check-deploy-button.outputs.is_deploy_button == 'true' && success()
        run: |
          echo "===================================================="
          echo "🎉 CloudHarbor 前端已成功部署到 Cloudflare Pages!"
          echo "===================================================="
          echo ""
          echo "注意: 您需要在 Cloudflare Pages 控制面板中手動設定環境變數:"
          echo "- 登入 https://dash.cloudflare.com/"
          echo "- 進入 Pages > cloudharbor-frontend > Settings > Environment variables"
          echo "- 新增 VITE_BACKEND_URL = 您的後端Worker URL"
          echo ""
          echo "後續步驟："
          echo "1. 訪問您的 Cloudflare Pages URL"
          echo "2. 使用預設管理員賬戶登入 (admin/admin123)"
          echo "3. 立即修改預設管理員密碼"
          echo "4. 在管理員面板中配置您的S3相容儲存"
          echo "===================================================="

      - name: Display Troubleshooting Info
        if: failure()
        run: |
          echo "===================================================="
          echo "❌ 部署失敗，可能的解決方案:"
          echo "1. 確保Cloudflare賬戶存在Pages專案"
          echo "2. 驗證API Token許可權 (Pages:Edit, Account:Read)"
          echo "3. 檢查GitHub Secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)"
          echo "===================================================="

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 前端部署成功!"
          else
            echo "❌ 前端部署失敗!"
          fi
