name: Deploy SPA CF Workers[一體化部署]

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "!frontend/vercel.json"
  workflow_dispatch:
    inputs:
      from_panel:
        description: "是否由部署控制面板觸發 / triggered from deployment control panel"
        required: false
        default: "false"
  repository_dispatch:
    types: [deploy-spa-button]

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: 🔍 檢查部署配置
        id: check
        run: |
          # 手動觸發（Actions 頁面 / 外部倉庫）時，總是部署，忽略自動部署開關
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 手動觸發（repository_dispatch），忽略開關，允許部署"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.from_panel }}" != "true" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 手動觸發（workflow_dispatch），忽略開關，允許部署"
            exit 0
          fi

          # 自動觸發（push 或控制面板觸發）根據倉庫級變數決定是否部署
          SPA_ENABLED="${{ vars.SPA_DEPLOY }}"
          # 預設行為：如果倉庫變數未設定，視為預設關閉，得去控制面板開啟
          [ -z "$SPA_ENABLED" ] && SPA_ENABLED="false"

          if [ "$SPA_ENABLED" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ SPA 自動部署已開啟，允許部署"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⏸️ SPA 自動部署已關閉，跳過部署"
          fi

  deploy-spa:
    needs: check-config
    if: needs.check-config.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check if deploy button trigger
        id: check-deploy-button
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" && "${{ github.event.action }}" == "deploy-spa-button" ]]; then
            echo "is_deploy_button=true" >> $GITHUB_OUTPUT
          else
            echo "is_deploy_button=false" >> $GITHUB_OUTPUT
          fi

      # ==================== 步驟 1：構建前端 ====================
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          echo "安裝前端依賴..."
          npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: |
          echo "構建前端靜態資源..."
          npm run build
        env:
          VITE_APP_ENV: production
          VITE_ENABLE_DEVTOOLS: false

      - name: Verify frontend build
        run: |
          echo "✅ 驗證前端構建產物..."
          if [ ! -d "frontend/dist" ]; then
            echo "❌ 前端構建失敗：dist 目錄不存在"
            exit 1
          fi

          if [ ! -f "frontend/dist/index.html" ]; then
            echo "❌ 前端構建失敗：index.html 不存在"
            exit 1
          fi

          echo "前端構建產物大小："
          du -sh frontend/dist
          echo "前端檔案數量："
          find frontend/dist -type f | wc -l

      # ==================== 步驟 2：準備後端部署 ====================
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          echo "安裝後端依賴（不包含可選依賴）..."
          if npm ci --no-optional; then
            echo "✅ npm ci 成功"
          else
            echo "⚠️ npm ci 失敗，將使用npm install更新lock檔案"
            npm install --no-optional
          fi

      - name: Disable wrangler telemetry
        working-directory: ./backend
        run: npx wrangler telemetry disable

      # ==================== 步驟 3：配置 D1 資料庫 ====================
      - name: Create or verify D1 Database
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "檢查並建立 D1 資料庫..."
          DATABASE_LIST=$(npx wrangler d1 list --json 2>/dev/null || echo "[]")
          EXISTING_DB=$(echo "$DATABASE_LIST" | jq -r '.[] | select(.name=="cloudharbor-db") | .uuid')

          if [ -n "$EXISTING_DB" ]; then
            echo "✅ 找到現有 D1 資料庫: $EXISTING_DB"
            DATABASE_ID=$EXISTING_DB
          else
            echo "建立新的 D1 資料庫..."
            CREATE_OUTPUT=$(npx wrangler d1 create cloudharbor-db 2>&1)

            if echo "$CREATE_OUTPUT" | grep -q "Successfully created DB"; then
              DATABASE_ID=$(echo "$CREATE_OUTPUT" | grep -oP "database_id = \"\K[^\"]+")
              if [ -z "$DATABASE_ID" ]; then
                DATABASE_ID=$(echo "$CREATE_OUTPUT" | grep -oP "([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})")
              fi
              echo "✅ 資料庫建立成功: $DATABASE_ID"
            else
              LIST_OUTPUT=$(npx wrangler d1 list --json 2>/dev/null || echo "[]")
              DATABASE_ID=$(echo "$LIST_OUTPUT" | jq -r '.[] | select(.name=="cloudharbor-db") | .uuid')

              if [ -z "$DATABASE_ID" ]; then
                echo "❌ 無法建立或找到 D1 資料庫"
                exit 1
              fi
            fi
          fi

          # 更新 wrangler.spa.toml 中的 database_id
          echo "更新 wrangler.spa.toml 中的資料庫 ID..."
          sed -i -E "s/(database_id = \")[^\"]+(\"\s*$)/\1$DATABASE_ID\2/" wrangler.spa.toml

          # 驗證更新
          if grep -q "$DATABASE_ID" wrangler.spa.toml; then
            echo "✅ wrangler.spa.toml 更新成功"
          else
            echo "❌ wrangler.spa.toml 更新失敗"
            exit 1
          fi

          echo "database_id=$DATABASE_ID" >> $GITHUB_ENV

      - name: Initialize D1 Database schema
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "初始化資料庫表結構..."
          npx wrangler d1 execute cloudharbor-db --file=./schema.sql || echo "⚠️ 表可能已存在，繼續部署"

      # ==================== 步驟 4：環境變數（優先順序：Worker現有 -> GitHub -> wrangler配置） ====================
      - name: Resolve ENCRYPTION_SECRET for deploy
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔐 檢查 ENCRYPTION_SECRET 配置..."

          # 1) 如果 Worker 裡已存在 ENCRYPTION_SECRET（作為 Secret），則保持不變（跳過）
          set +e
          SECRET_LIST_OUTPUT=$(npx wrangler secret list --name cloudharbor-spa 2>&1)
          set -e
          if echo "$SECRET_LIST_OUTPUT" | grep -q "ENCRYPTION_SECRET"; then
            echo "✅ Worker 已存在 ENCRYPTION_SECRET（Secret），保持不變"
            exit 0
          fi

          # 2) 如果 GitHub Secrets 裡配置了 ENCRYPTION_SECRET，則使用
          if [[ -n "${{ secrets.ENCRYPTION_SECRET }}" ]]; then
            echo "✅ 使用 GitHub Secrets 中的 ENCRYPTION_SECRET"
            ENCRYPTION_VALUE="${{ secrets.ENCRYPTION_SECRET }}"
            ENCRYPTION_ESCAPED=$(printf '%s' "$ENCRYPTION_VALUE" | sed -e 's/[\\/&]/\\&/g')

            if grep -q "^ENCRYPTION_SECRET =" wrangler.spa.toml; then
              sed -i -E "s/^ENCRYPTION_SECRET = \".*\"$/ENCRYPTION_SECRET = \"${ENCRYPTION_ESCAPED}\"/" wrangler.spa.toml
            else
              sed -i -E "/^\\[vars\\]$/a\\ENCRYPTION_SECRET = \"${ENCRYPTION_ESCAPED}\"" wrangler.spa.toml
            fi
            exit 0
          fi

          # 3) GitHub 沒配：用 wrangler.spa.toml 
          if grep -q "^ENCRYPTION_SECRET =" wrangler.spa.toml; then
            echo "✅ 使用 wrangler.spa.toml 中的 ENCRYPTION_SECRET"
          else
            echo "❌ 缺少 ENCRYPTION_SECRET：GitHub Secrets 未配置，wrangler.spa.toml 也沒寫"
            exit 1
          fi

      # ==================== 步驟 5：部署 SPA Worker ====================
      - name: Deploy to Cloudflare Workers (SPA Mode)
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 使用 SPA 配置部署到 Cloudflare Workers..."
          npx wrangler deploy --config wrangler.spa.toml 2>&1 | sed -E 's/https:\/\/[a-zA-Z0-9.-]*\.(workers|pages)\.dev/https:\/\/[REDACTED].\1.dev/g'

      # ==================== 步驟 6：部署後驗證 ====================
      - name: Display Success Information
        if: steps.check-deploy-button.outputs.is_deploy_button == 'true' && success()
        run: |
          echo "===================================================="
          echo "🎉 CloudHarbor SPA 已成功部署到 Cloudflare Workers!"
          echo "===================================================="
          echo ""
          echo "✅ 部署模式：Workers + Static Assets 一體化"
          echo "✅ Worker 名稱：cloudharbor-spa"
          echo "✅ 前端和後端已部署到同一個 Worker"
          echo ""
          echo "後續步驟："
          echo "1. 訪問您的 Worker URL (https://cloudharbor-spa.your-account.workers.dev)"
          echo "2. 首次訪問會自動初始化資料庫"
          echo "3. 使用預設管理員賬戶登入 (admin/admin123)"
          echo "4. ⚠️  立即修改預設管理員密碼"
          echo "5. 在管理員面板中配置您的 S3 相容儲存"
          echo "6. （可選）在 Cloudflare Dashboard 中繫結自定義域名"
          echo ""
          echo "優勢："
          echo "- 前後端同源請求，無跨域問題"
          echo "- 導航請求不計費，成本降低 60%+"
          echo "- 無需單獨管理 Cloudflare Pages"
          echo "===================================================="

      - name: Display Troubleshooting Info
        if: failure()
        run: |
          echo "===================================================="
          echo "❌ 部署失敗，可能的解決方案:"
          echo ""
          echo "1. 前端構建問題："
          echo "   - 檢查 frontend/package.json 依賴是否正確"
          echo "   - 驗證 npm run build 在本地是否成功"
          echo ""
          echo "2. 後端部署問題："
          echo "   - 確保 wrangler.spa.toml 配置正確"
          echo "   - 驗證 D1 資料庫許可權"
          echo "   - 檢查 CLOUDFLARE_API_TOKEN 許可權（需要 Workers:Edit, D1:Edit）"
          echo ""
          echo "3. 驗證 GitHub Secrets："
          echo "   - CLOUDFLARE_API_TOKEN: Workers 和 D1 編輯許可權"
          echo "   - CLOUDFLARE_ACCOUNT_ID: Cloudflare 賬戶 ID"
          echo ""
          echo "4. 檢視上方詳細錯誤資訊以定位問題"
          echo "===================================================="

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ SPA Worker部署成功！"
          else
            echo "❌ SPA Worker部署失敗！"
          fi
