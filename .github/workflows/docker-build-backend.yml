name: Build and Push backend Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "自定義版本標籤(不包含v字首)"
        required: false
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定版本
        id: set-version
        run: |
          # 1. 首先檢查是否有手動指定的版本
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. 使用短提交雜湊作為版本（因為沒有標籤推送觸發）
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT

  build-backend:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定QEMU
        uses: docker/setup-qemu-action@v3

      - name: 設定Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登入到Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 構建並推送後端映象
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudharbor-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudharbor-backend:${{ needs.setup.outputs.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
