name: 🐛 錯誤報告[中文]
description: 建立一個報告以幫助我們改進專案
title: "[BUG]: "
labels: ['bug']
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前檢查
      description: |
        在提交 Issue 前請確保您已經完成了以下所有步驟。
      options:
        - label: 我已經檢視了 **相關 Issue** 並搜尋了現有的Issue沒有找到類似的問題。
          required: true

  - type: dropdown
    id: device-type
    attributes:
      label: 部署方式
      description: 採用的部署方式？
      options:
        - Docker
        - Cloudflare worker
        - Cloudflare Worker And Pages
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 作業系統
      description: 您正在使用哪個作業系統？
      placeholder: 例如 Windows,Linux,MacOS,IOS,Android...
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 應用/專案版本
      description: 您正在執行的應用/專案版本是什麼？
      placeholder: 例如 v1.2.3
    validations:
      required: true

  - type: textarea
    id: bug-overview
    attributes:
      label: 問題概述 (實際行為)
      description: |
        請清晰、簡潔地描述你遇到的錯誤。
      placeholder: 詳細描述您遇到的問題...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 復現步驟
      description: 請詳細列出如何復現這個錯誤的步驟。如果可能，請為每個步驟附上截圖。
      placeholder: |
        1. 前往 '...'
        2. 點選 '....'
        3. 滾動到 '....'
        4. 出現錯誤 '...'
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 預期行為
      description: 請描述您期望看到的正確行為。
      placeholder: 我期望當...時，會發生...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截圖 (可選)
      description: 如果可能，請新增截圖以幫助解釋您的問題。您可以將圖片直接拖拽到這裡。
      placeholder: 在此貼上或拖拽截圖...
    validations:
      required: false

  - type: textarea
    id: console-logs
    attributes:
      label: 控制檯日誌 (如果適用)
      description: 請複製並貼上任何相關的控制檯錯誤日誌。這對於 Web 應用或開發者工具相關的問題尤其重要。
      placeholder: |
        ```text
        在此貼上您的錯誤日誌...
        ```
      render: shell # 使用 'shell' 或 'text' 來更好地格式化日誌
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 其他資訊 (可選)
      description: 還有其他你認為可能與此問題相關的背景資訊嗎？（例如：你是在特定的網路環境下，或者剛剛執行了某個特殊操作後出現的等）
    validations:
      required: false
